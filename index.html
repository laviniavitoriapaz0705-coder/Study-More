        // Audio Engine using Web Audio API (No external MP3 files required)
        let audioCtx = null;
        let isMuted = localStorage.getItem('ESTUDAMAIS_MUTED') === 'true';

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (isMuted) return;
            try {
                const ctx = getAudioContext();
                if (!ctx) return;

                const now = ctx.currentTime;

                if (type === 'click') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(600, now);
                    osc.frequency.exponentialRampToValueAtTime(300, now + 0.05);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.05);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.05);
                } 
                else if (type === 'correct') {
                    // Upward Arpeggio for correct answer
                    const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                    notes.forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const startTime = now + (idx * 0.06);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, startTime);
                        gain.gain.setValueAtTime(0.2, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(startTime);
                        osc.stop(startTime + 0.15);
                    });
                } 
                else if (type === 'wrong') {
                    // Downward Low Tone for wrong answer
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now); // A3
                    osc.frequency.linearRampToValueAtTime(130, now + 0.25); // C3
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } 
                else if (type === 'victory') {
                    // Celebration fanfare for completing quiz
                    const melody = [
                        { f: 523.25, d: 0.12, delay: 0 },    // C5
                        { f: 659.25, d: 0.12, delay: 0.12 }, // E5
                        { f: 783.99, d: 0.12, delay: 0.24 }, // G5
                        { f: 1046.50, d: 0.4, delay: 0.36 }  // C6
                    ];
                    melody.forEach(note => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const startTime = now + note.delay;
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(note.f, startTime);
                        gain.gain.setValueAtTime(0.25, startTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, startTime + note.d);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(startTime);
                        osc.stop(startTime + note.d);
                    });
                }
            } catch (e) {
                console.warn("Audio Context playback error:", e);
            }
        }
